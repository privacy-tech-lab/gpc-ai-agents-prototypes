version: 2
updates:
  # npm dependencies for every prototype. One entry covers all eight package
  # directories; a prototype missing from this list gets ungrouped PRs that
  # the auto-merge workflow ignores, and no scheduled version updates at all
  # (prototype-7 and 8 were missing after the rename, issue #113).
  #
  # Minor and patch version updates are grouped so they can be auto-merged;
  # major version updates are grouped separately and left for manual review.
  # Security updates are grouped by the same split, but note that Dependabot
  # files security bumps of TRANSITIVE packages under the major group even
  # when the bump is a patch (fast-uri 3.1.5 to 3.1.7 landed as
  # npm-security-major), so the auto-merge workflow accepts both security
  # groups and relies on the required Tests check instead.
  - package-ecosystem: npm
    directories:
      - /prototype-1
      - /prototype-2
      - /prototype-3
      - /prototype-4
      - /prototype-5
      - /prototype-6
      - /prototype-7
      - /prototype-8
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Version updates
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
      # Security updates
      npm-security-minor-and-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
      npm-security-major:
        applies-to: security-updates
        update-types:
          - major

  # The GitHub Actions used by the workflows in this repo. Left ungrouped, so
  # action bumps come as individual PRs for manual review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
