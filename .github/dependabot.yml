version: 2
updates:
  # npm dependencies for every prototype. The prototypes are npm workspaces
  # sharing ONE lockfile at the repository root, so a single entry on "/"
  # covers all of them and one advisory produces one alert and one PR.
  # Before this (issue #113) each prototype had its own lockfile and every
  # advisory arrived seven times over.
  #
  # Minor and patch version updates are grouped so they can be auto-merged;
  # major version updates are grouped separately and left for manual review.
  # Security updates are grouped by the same split, but note that Dependabot
  # files security bumps of TRANSITIVE packages under the major group even
  # when the bump is a patch (fast-uri 3.1.5 to 3.1.7 landed as
  # npm-security-major), so the auto-merge workflow accepts both security
  # groups and relies on the required Tests check instead.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Version updates
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
      # Security updates
      npm-security-minor-and-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
      npm-security-major:
        applies-to: security-updates
        update-types:
          - major

  # The GitHub Actions used by the workflows in this repo. Left ungrouped, so
  # action bumps come as individual PRs for manual review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
