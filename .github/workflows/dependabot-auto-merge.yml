name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge the grouped minor and patch VERSION updates, and EVERY
      # grouped security update. Security bumps of transitive packages are
      # filed under npm-security-major regardless of semver (issue #113), so
      # filtering security PRs by group suffix left every one of them waiting
      # for a human. Major version updates (npm-major) stay manual.
      #
      # "--auto" merges only once the required checks pass, which is the
      # Tests workflow via the branch ruleset on main. Without that ruleset
      # this step merges immediately, before the tests have finished.
      - name: Approve and enable auto-merge for patch, minor and security updates
        if: >-
          endsWith(steps.metadata.outputs.dependency-group, '-minor-and-patch') ||
          startsWith(steps.metadata.outputs.dependency-group, 'npm-security-')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
