name: Tests

# Runs the jest suite for each architecture on every PR and on pushes to main.
# This is the check that gates Dependabot auto-merge: a minor or patch update
# only merges once these pass. Require it in branch protection for main.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - architecture-a
          - architecture-c
          - architecture-e
          - category-c-use
    defaults:
      run:
        working-directory: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
